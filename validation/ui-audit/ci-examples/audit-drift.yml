              }
              await github.rest.issues.update(patch);
            } else {
              await github.rest.issues.create({ owner, repo, title, body });
            }

      - name: Upload artifacts
        if: steps.mdk_ui_token.outputs.enabled == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: audit-private-${{ github.run_id }}
          path: qa/audit-demo-app-local/runs/private/
          retention-days: 7
