# Weekly + on-demand integration smoke for the audit pipeline (Layer C).
# Validates clone → audit → classify → notify → structural verifier → artifact.
# Does not upsert GitHub issues (avoids noise vs production nightly).

name: Audit drift smoke

on:
  schedule:
    # Monday 06:30 UTC — distinct from nightly audit (02:00 UTC)
    - cron: "30 6 * * 1"
  workflow_dispatch:
  pull_request:
    branches: [main, staging]
    paths:
      - "qa/audit-demo-app-ci/github-actions/audit-drift.yml"
      - "qa/audit-demo-app-ci/github-actions/audit-drift-smoke.yml"
      - "qa/audit-demo-app-local/**"
      - "scripts/classify-audit.ts"
      - "scripts/notify-audit.ts"
      - "scripts/verify-audit-run.ts"

permissions:
  contents: read

env:
  NODE_VERSION: "22"

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: rhysd/actionlint@03d0035246f3e81f36aed592ffb4bebf33a03106 # v1.7.7
        with:
          args: -color -ignore "context \"secrets\" is not allowed here"

  smoke-public:
    name: Smoke (public)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [actionlint]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Clone tetherto/mdk (public)
        run: |
          set -euo pipefail
          git clone --depth 1 -b main \
            "https://github.com/tetherto/mdk.git" \
            "$RUNNER_TEMP/mdk-upstream"
          echo "UPSTREAM_SHA=$(git -C "$RUNNER_TEMP/mdk-upstream" rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Write audit.config.yaml
        run: |
          set -euo pipefail
          REPOPATH="$RUNNER_TEMP/mdk-upstream/ui-client"
          {
            echo "default: public"
            echo "sources:"
            echo "  public:"
            echo "    repo: ${REPOPATH}"
            echo "    branch: main"
            echo "    githubUrl: https://github.com/tetherto/mdk"
            echo "    githubSubpath: ui-client"
            echo "    docsBaseUrl: https://docs.mdk.tether.io"
            echo "    demoApp: apps/demo"
          } > qa/audit-demo-app-local/audit.config.yaml

      - name: Run audit
        env:
          MDK_AUDIT_SOURCE: public
          MDK_AUDIT_OUT_DIR: qa/audit-demo-app-local/runs/public
          MDK_PUBLIC_REPO: ${{ runner.temp }}/mdk-upstream/ui-client
          MDK_PUBLIC_BRANCH: main
        run: node qa/audit-demo-app-local/audit.mjs

      - name: Classify
        run: |
          npx tsx scripts/classify-audit.ts \
            --baseline qa/audit-demo-app-local/components-audit.json \
            --current qa/audit-demo-app-local/runs/public/components-audit.json \
            --source public \
            --upstream-sha "$UPSTREAM_SHA" \
            --upstream-ref "tetherto/mdk@main" \
            --out qa/audit-demo-app-local/runs/public/audit-report.json

      - name: Notify (Slack or summary)
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: npx tsx scripts/notify-audit.ts --report qa/audit-demo-app-local/runs/public/audit-report.json

      - name: Verify run outputs
        run: |
          npx tsx scripts/verify-audit-run.ts \
            --run-dir qa/audit-demo-app-local/runs/public \
            --source public \
            --upstream-sha "$UPSTREAM_SHA"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: audit-smoke-public-${{ github.run_id }}
          path: qa/audit-demo-app-local/runs/public/
          retention-days: 7

  smoke-private:
    name: Smoke (private / mdk-ui)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [actionlint]
    steps:
      # secrets context is not allowed in job-level if; gate here instead.
      - name: Check MDK_UI_REPO_TOKEN
        id: mdk_ui_token
        run: |
          if [ -n "${MDK_UI_REPO_TOKEN}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Private mdk-ui smoke skipped (MDK_UI_REPO_TOKEN not set)."
          fi
        env:
          MDK_UI_REPO_TOKEN: ${{ secrets.MDK_UI_REPO_TOKEN }}

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        if: steps.mdk_ui_token.outputs.enabled == 'true'

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        if: steps.mdk_ui_token.outputs.enabled == 'true'
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci
        if: steps.mdk_ui_token.outputs.enabled == 'true'

      - name: Clone mdk-ui (authenticated)
        if: steps.mdk_ui_token.outputs.enabled == 'true'
        env:
          MDK_UI_REPO_TOKEN: ${{ secrets.MDK_UI_REPO_TOKEN }}
        run: |
          set -euo pipefail
          git clone --depth 1 -b develop \
            "https://x-access-token:${MDK_UI_REPO_TOKEN}@github.com/tetherto/mdk-ui.git" \
            "$RUNNER_TEMP/mdk-upstream"
          echo "UPSTREAM_SHA=$(git -C "$RUNNER_TEMP/mdk-upstream" rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Write audit.config.yaml
        if: steps.mdk_ui_token.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          REPOPATH="$RUNNER_TEMP/mdk-upstream"
          {
            echo "default: private"
            echo "sources:"
            echo "  private:"
            echo "    repo: ${REPOPATH}"
            echo "    branch: develop"
            echo "    githubUrl: https://github.com/tetherto/mdk-ui"
            echo "    githubSubpath: \"\""
            echo "    docsBaseUrl: \"\""
            echo "    demoApp: apps/demo"
          } > qa/audit-demo-app-local/audit.config.yaml

      - name: Run audit
        if: steps.mdk_ui_token.outputs.enabled == 'true'
        env:
          MDK_AUDIT_SOURCE: private
          MDK_AUDIT_OUT_DIR: qa/audit-demo-app-local/runs/private
          MDK_PRIVATE_REPO: ${{ runner.temp }}/mdk-upstream
          MDK_PRIVATE_BRANCH: develop
          MDK_PRIVATE_GITHUB_URL: https://github.com/tetherto/mdk-ui
        run: node qa/audit-demo-app-local/audit.mjs

      - name: Classify
        if: steps.mdk_ui_token.outputs.enabled == 'true'
        run: |
          npx tsx scripts/classify-audit.ts \
            --baseline qa/audit-demo-app-local/components-audit.json \
            --current qa/audit-demo-app-local/runs/private/components-audit.json \
            --source private \
            --upstream-sha "$UPSTREAM_SHA" \
            --upstream-ref "tetherto/mdk-ui@develop" \
            --out qa/audit-demo-app-local/runs/private/audit-report.json

      - name: Notify (Slack or summary)
        if: steps.mdk_ui_token.outputs.enabled == 'true'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: npx tsx scripts/notify-audit.ts --report qa/audit-demo-app-local/runs/private/audit-report.json

      - name: Verify run outputs
        if: steps.mdk_ui_token.outputs.enabled == 'true'
        run: |
          npx tsx scripts/verify-audit-run.ts \
            --run-dir qa/audit-demo-app-local/runs/private \
            --source private \
            --upstream-sha "$UPSTREAM_SHA"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: steps.mdk_ui_token.outputs.enabled == 'true'
        with:
          name: audit-smoke-private-${{ github.run_id }}
          path: qa/audit-demo-app-local/runs/private/
          retention-days: 7
